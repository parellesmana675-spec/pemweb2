<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pendidikan</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8eef5;
            margin: 0;
            padding: 30px;
        }

        fieldset {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid #2c3e50;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: white;
        }

        caption {
            font-size: 18px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border: 1px solid #bdc3c7;
        }

        td {
            padding: 12px;
            border: 1px solid #bdc3c7;
            text-align: center;
            color: #333333;
        }

        tbody tr:nth-child(even) {
            background-color: #ecf0f1;
        }

        tbody tr:hover {
            background-color: #d6eaf8;
            transition: 0.3s;
        }

        /* Tampilan layar HP */
        @media screen and (max-width: 600px) {
            body {
                padding: 10px;
            }

            fieldset {
                padding: 10px;
                margin: 10px auto;
            }

            h1 {
                font-size: 22px;
            }

            th, td {
                padding: 8px 4px;
                font-size: 12px;
            }

            caption {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <fieldset>
        <h1>Riwayat Pendidikan</h1>

        <table>
            <caption>Riwayat Pendidikan</caption>

            <thead>
                <tr>
                    <th>No</th>
                    <th>Jenjang</th>
                    <th>Nama Sekolah</th>
                    <th>Tahun</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>SD</td>
                    <td>SD Negeri Sidamulya</td>
                    <td>2014 - 2020</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>SMP</td>
                    <td>SMP Negeri 3 Cipunagara</td>
                    <td>2020 - 2023</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>SMA</td>
                    <td>SMA Negeri 2 Subang</td>
                    <td>2023 - 2026</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>KULIAH</td>
                    <td>Universitas Mandiri</td>
                    <td>2026 - Sekarang</td>
                </tr>
            </tbody>
        </table>
    </fieldset>

</body>
</html>
